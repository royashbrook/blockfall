name: BlockfallPad
options:
  bundleIdPrefix: com.blockfall
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    ARCHS: arm64
    CURRENT_PROJECT_VERSION: 100
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: true
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    ONLY_ACTIVE_ARCH: false
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"
targets:
  BlockfallPad:
    type: application
    platform: iOS
    sources:
      - path: BlockfallPad
      - path: ../app/Sources/BlockfallApp/AmbientBirdSystem.swift
      - path: ../app/Sources/BlockfallApp/CharacterAppearance.swift
      - path: ../app/Sources/BlockfallApp/EngineInterop.swift
      - path: ../app/Sources/BlockfallApp/EntityRenderer.swift
      - path: ../app/Sources/BlockfallApp/EntityRendererMath.swift
      - path: ../app/Sources/BlockfallApp/EntityRendererShaders.swift
      - path: ../app/Sources/BlockfallApp/EntityRendererSpecies.swift
      - path: ../app/Sources/BlockfallApp/EntityRendererTypes.swift
      - path: ../app/Sources/BlockfallApp/GameAudio.swift
      - path: ../app/Sources/BlockfallApp/NetDiscovery.swift
      - path: ../app/Sources/BlockfallApp/ParticleSystem.swift
      - path: ../app/Sources/BlockfallApp/Renderer.swift
      - path: ../app/Sources/BlockfallApp/RendererBuffers.swift
      - path: ../app/Sources/BlockfallApp/RendererShaders.swift
      - path: ../app/Sources/BlockfallApp/RendererTypes.swift
      - path: ../app/Sources/BlockfallApp/TownNames.swift
      - path: ../content
        type: folder
        buildPhase: resources
      - path: ../LICENSE
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - framework: ../app/Artifacts/CBlockcore.xcframework
        embed: false
        link: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: BlockfallPad/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.blockfall.game
        PRODUCT_NAME: Blockfall
        SUPPORTS_MACCATALYST: false
        SWIFT_OBJC_BRIDGING_HEADER: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
schemes:
  BlockfallPad:
    build:
      targets:
        BlockfallPad: all
    run:
      config: Debug
    archive:
      config: Release
