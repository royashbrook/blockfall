[package]
name = "bfcore"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Blockfall blockcore engine (migration in progress, parity-gated)"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
